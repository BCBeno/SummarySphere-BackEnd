# Test-specific properties: use in-memory H2 DB to avoid CI Postgres role issues
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# Ensure logs are visible in CI test output
logging.level.root=INFO

# Provide dummy values for external integrations so placeholders resolve during tests
azure.storage.connection-string=DefaultEndpointsProtocol=https;AccountName=test;AccountKey=fakeKey;EndpointSuffix=core.windows.net
azure.storage.container-name=test-container
spring.mail.username=test@example.com
spring.mail.password=test
MAIL_EMAIL=test@example.com
MAIL_PASS=test
GOOGLE_API_KEY=test
# JWT_SECRET=ZmFrZXNlY3JldA==

# JWT properties expected by JwtService
jwt.secret=ZmFrZXNlY3JldA==
jwt.expiration=3600000

# Disable cached content and other optional AI features during tests
spring.ai.google.genai.chat.enable-cached-content=false
spring.ai.google.genai.chat.enabled=false
# Disable Spring AI chat client in tests and/or provide a fake project-id so auto-config won't fail
spring.ai.chat.client.enabled=false
spring.ai.model.chat=none
spring.ai.google.genai.project-id=test-project

# Prevent Spring AI auto-configuration during tests (exclude problematic auto-config classes)
spring.autoconfigure.exclude=org.springframework.ai.model.google.genai.autoconfigure.chat.GoogleGenAiChatAutoConfiguration,org.springframework.ai.model.chat.client.autoconfigure.ChatClientAutoConfiguration
