# Test-specific properties: use in-memory H2 DB to avoid CI Postgres role issues
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# Ensure logs are visible in CI test output
logging.level.root=INFO

# Provide dummy values for external integrations so placeholders resolve during tests
azure.storage.connection-string=DefaultEndpointsProtocol=https;AccountName=test;AccountKey=fakeKey;EndpointSuffix=core.windows.net
azure.storage.container-name=test-container
spring.mail.username=test@example.com
spring.mail.password=test
MAIL_EMAIL=test@example.com
MAIL_PASS=test
GOOGLE_API_KEY=test
# JWT_SECRET=ZmFrZXNlY3JldA==

# JWT properties expected by JwtService
jwt.secret=ZmFrZXNlY3JldA==
jwt.expiration=3600000

# AI Configuration for Tests
spring.ai.openai.api-key=sk-dummy-key-for-tests-only
spring.ai.openai.chat.enabled=false
spring.ai.openai.embedding.enabled=false
spring.ai.openai.audio.speech.enabled=false
spring.ai.openai.audio.transcription.enabled=false
spring.ai.openai.image.enabled=false

# Prevent Spring AI auto-configuration issues during tests
spring.autoconfigure.exclude=org.springframework.ai.autoconfigure.openai.OpenAiAutoConfiguration,org.springframework.ai.vectorstore.pgvector.autoconfigure.PgVectorStoreAutoConfiguration,org.springframework.ai.model.google.genai.autoconfigure.chat.GoogleGenAiChatAutoConfiguration,org.springframework.ai.model.google.genai.autoconfigure.embedding.GoogleGenAiEmbeddingAutoConfiguration

